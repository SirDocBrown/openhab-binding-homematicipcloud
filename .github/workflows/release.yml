name: Build and release binding

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.assets.outputs.tag }}
      publish: ${{ steps.assets.outputs.publish }}
    steps:
      - name: Check out binding
        uses: actions/checkout@v4
        with:
          path: binding
      - name: Check out minimum supported openHAB reactor
        uses: actions/checkout@v4
        with:
          repository: openhab/openhab-addons
          ref: 5.0.0
          path: reactor
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            reactor/pom.xml
            reactor/bundles/pom.xml
            binding/pom.xml
      - name: Register binding in the reactor
        run: |
          set -eu
          module=reactor/bundles/org.openhab.binding.homematicipcloud
          mkdir "$module"
          cp -R binding/src binding/pom.xml binding/README.md "$module/"
          sed -i '/<module>org.openhab.binding.homematic<\/module>/a\    <module>org.openhab.binding.homematicipcloud</module>' reactor/bundles/pom.xml
      - name: Check formatting, run tests and package
        working-directory: reactor
        run: mvn --batch-mode -pl :org.openhab.binding.homematicipcloud spotless:check package
      - name: Verify release version and prepare files
        id: assets
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -eu
          binding=org.openhab.binding.homematicipcloud
          version=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("binding/pom.xml").findtext("{http://maven.apache.org/POM/4.0.0}version"))')
          jar="reactor/bundles/$binding/target/$binding-$version.jar"
          manifest_version=$(unzip -p "$jar" META-INF/MANIFEST.MF | tr -d '\r' | sed -n 's/^Bundle-Version: //p')
          [[ "$manifest_version" == "$version" ]]
          subject="${COMMIT_MESSAGE%%$'\n'*}"
          publish=false
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            publish=true
            tag="$GITHUB_REF_NAME"
          elif [[ "$subject" == 'Release v'* ]]; then
            publish=true
            tag="${subject#Release }"
          fi
          [[ "$tag" == "v$version" ]]
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir assets
          cp "$jar" "assets/$binding-${tag#v}.jar"
          cd assets
          sha256sum *.jar | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: binding
          path: assets/
          if-no-files-found: error

  release:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binding
          path: assets
      - name: Publish tagged build
        working-directory: assets
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          sha256sum -c SHA256SUMS
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            if ! sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha'); then
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
            else
              [[ "$sha" == "$GITHUB_SHA" ]]
            fi
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Homematic IP Cloud $TAG" --generate-notes *.jar SHA256SUMS
