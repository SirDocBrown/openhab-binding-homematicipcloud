name: Build and release binding

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out binding
        uses: actions/checkout@v4
        with:
          path: binding
      - name: Check out minimum supported openHAB reactor
        uses: actions/checkout@v4
        with:
          repository: openhab/openhab-addons
          ref: 5.0.0
          path: reactor
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            reactor/pom.xml
            reactor/bundles/pom.xml
            binding/pom.xml
      - name: Register binding in the reactor
        run: |
          set -eu
          module=reactor/bundles/org.openhab.binding.homematicipcloud
          mkdir "$module"
          cp -R binding/src binding/pom.xml binding/README.md "$module/"
          sed -i '/<module>org.openhab.binding.homematic<\/module>/a\    <module>org.openhab.binding.homematicipcloud</module>' reactor/bundles/pom.xml
      - name: Check formatting, run tests and package
        working-directory: reactor
        run: mvn --batch-mode -pl :org.openhab.binding.homematicipcloud spotless:check package
      - name: Prepare release files
        run: |
          set -eu
          mkdir assets
          cp reactor/bundles/org.openhab.binding.homematicipcloud/target/org.openhab.binding.homematicipcloud-5.0.0.jar assets/
          cd assets
          sha256sum *.jar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: binding
          path: assets/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binding
          path: assets
      - name: Publish tagged build
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Homematic IP Cloud $GITHUB_REF_NAME" --generate-notes *.jar SHA256SUMS
